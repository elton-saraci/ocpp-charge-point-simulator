name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/elton-saraci/ocpp-charge-point-simulator:latest-${{ matrix.suffix }}
            ghcr.io/elton-saraci/ocpp-charge-point-simulator:${{ github.sha }}-${{ matrix.suffix }}

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/elton-saraci/ocpp-charge-point-simulator:latest \
            ghcr.io/elton-saraci/ocpp-charge-point-simulator:latest-amd64 \
            ghcr.io/elton-saraci/ocpp-charge-point-simulator:latest-arm64

      - name: Create multi-arch manifest (sha)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/elton-saraci/ocpp-charge-point-simulator:${{ github.sha }} \
            ghcr.io/elton-saraci/ocpp-charge-point-simulator:${{ github.sha }}-amd64 \
            ghcr.io/elton-saraci/ocpp-charge-point-simulator:${{ github.sha }}-arm64
